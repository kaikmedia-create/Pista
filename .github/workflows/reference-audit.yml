name: Pista reference audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reference-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current source and user-selected reference
        run: |
          mkdir -p reference-evidence/source
          git archive HEAD | tar -x -C reference-evidence/source
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          p=Path('reference-evidence')
          url='https://lil-koi-afk.github.io/backyard-tracker/index.html'
          raw=urllib.request.urlopen(url,timeout=30).read().decode()
          # Inspect the public app without requesting or modifying its Firebase data.
          raw=raw.replace('const [authed, setAuthed] = useState(localStorage.getItem("byu-auth") === "true");','const [authed, setAuthed] = useState(true);')
          raw=raw.replace('async function cloudLoad() {','async function cloudLoad() { return {};')
          raw=raw.replace('async function cloudSave(data) {','async function cloudSave(data) { return false;')
          (p/'reference.html').write_text(raw)
          (p/'reference-url.txt').write_text(url)
          PY
      - name: Capture reference on mobile
        run: |
          pip install -q playwright==1.64.1
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
              page.route('**/*firebasedatabase.app/**',lambda route: route.abort())
              page.goto(Path('reference-evidence/reference.html').resolve().as_uri())
              page.wait_for_selector('h3')
              page.screenshot(path='reference-evidence/reference-mobile.png',full_page=True)
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pista-reference-and-source
          path: reference-evidence/
          retention-days: 3
