name: Assemble and test training review
on:
  push:
    branches: [work/training-review-20261107]
    paths: [.github/workflows/assemble-training-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-verified source edits
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = ''.join(Path(f'.review/part-{i}.b64').read_text() for i in (1,2,3))
          raw = base64.b64decode(parts, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '8a7817d6d81a3357ced16af5f78db82057b1fc78cfb84c4592a640e777316d40', 'Transfer checksum mismatch'
          bundle = json.loads(lzma.decompress(raw))
          allowed = {'training-plan.js','package.json','core.js','README.md','pdf.js','version.js','tracker-view.js','app.js','version.json','tests/pdf.test.js','tests/plan.test.js','tests/browser_test.py','docs/training-review-2026-11.md'}
          assert set(bundle) == allowed
          outputs = {}
          for name, change in bundle.items():
              path = Path(name)
              old = path.read_bytes() if path.exists() else b''
              digest = hashlib.sha256(old).hexdigest() if path.exists() else None
              assert digest == change['before'], f'Source changed: {name}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == change['after'], f'Result checksum mismatch: {name}'
              outputs[name] = new
          Path('review-plan-v33.mjs').write_bytes(Path('training-plan.js').read_bytes())
          for name, content in outputs.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print(f'Applied {len(outputs)} verified source files.')
          PY
      - name: Preserve exact legacy migration fixture
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {TRAINING_PLAN} from './review-plan-v33.mjs';
          import {normalizePlan} from './core.js';
          fs.mkdirSync('tests/fixtures',{recursive:true});
          fs.writeFileSync('tests/fixtures/plan-v33.json',JSON.stringify(normalizePlan(TRAINING_PLAN),null,2));
          JS
          echo 'a8222a6357976096683b7452749ee24646b079c5eaa8e8907bf9025c04462cdc  tests/fixtures/plan-v33.json' | sha256sum -c -
          rm review-plan-v33.mjs
      - name: Build and unit-test the release
        run: |
          npm run release:build
          npm run check
          npm test
      - name: Install browser test dependencies
        run: |
          mkdir -p test-results
          pip install -q -r requirements-test.txt
          python -m playwright install --with-deps chromium webkit > test-results/browser-install.log 2>&1 || { tail -100 test-results/browser-install.log; exit 1; }
      - name: Full Chromium and WebKit tests
        run: python tests/browser_test.py
      - name: Commit only the verified revision on the work branch
        run: |
          rm .review/part-1.b64 .review/part-2.b64 .review/part-3.b64
          rm .github/workflows/review-source.yml .github/workflows/assemble-training-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-plan.js package.json core.js README.md pdf.js version.js tracker-view.js app.js version.json tests/pdf.test.js tests/plan.test.js tests/browser_test.py tests/fixtures/plan-v33.json docs/training-review-2026-11.md
          git add -u .review .github/workflows
          git diff --cached --stat
          git commit -m 'feat: progressive distance-based training, commute buffers and note-free PDFs'
          git push origin HEAD:work/training-review-20261107
          git rev-parse HEAD > test-results/tested-commit.txt
      - name: Test evidence
        if: always()
        run: |
          if [ -f test-results/browser-results.json ]; then cat test-results/browser-results.json; fi
          if [ -f test-results/failure.txt ]; then cat test-results/failure.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pista-training-review-evidence
          path: test-results/
          retention-days: 7
