name: Pista quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/browser_test.py
      - name: Test evidence summary
        if: always()
        run: |
          if [ -f test-results/browser-results.json ]; then cat test-results/browser-results.json; fi
          if [ -f test-results/failure.txt ]; then cat test-results/failure.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pista-test-evidence
          path: test-results/
          retention-days: 14
