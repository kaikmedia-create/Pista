name: Training review source snapshot
on:
  push:
    branches: [work/training-review-20261107]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/pista-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pista-source-review
          path: /tmp/pista-source.zip
          retention-days: 1
