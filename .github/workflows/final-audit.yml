name: Final release audit
on:
  push:
    branches: [qa/final-release-20261108]
    paths: [.github/workflows/final-audit.yml, tests/final_stress_test.py]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply critical fixes and build candidate
        run: |
          python .qa/stabilize.py
          python .qa/concurrency.py
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js');s=p.read_text()
          s=s.replace('state=latest();render();if(modalWorkout', 'state=updateClientPlanState(normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)||event.newValue)));render();if(modalWorkout')
          p.write_text(s)
          PY
          npm run release:build
      - name: Reproducible source snapshot
        run: |
          mkdir -p /tmp/pista-audit-source
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/pista-audit-source/source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name and Path(name).is_file():z.write(name,name)
          PY
          for item in '3.3:36abfdfec3e432e7a7ac7b41e425387cf00971fe' '3.4:8c6d09c8616f8f5633fe382137a573feff9f0237' '3.5:97225a681ca47f1df3dd7e5e8250f5987312d974'; do
            label=${item%%:*}; ref=${item#*:}; git archive --format=zip "$ref" -o "/tmp/pista-audit-source/v${label}.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: final-audit-source
          path: /tmp/pista-audit-source/
          retention-days: 7
      - name: Unit tests and release integrity
        run: |
          mkdir -p test-results
          npm run check
          npm test | tee test-results/unit-tests.txt
      - name: Browser dependencies
        run: |
          pip install -q -r requirements-test.txt
          python -m playwright install --with-deps chromium webkit firefox > test-results/browser-install.log 2>&1 || { tail -80 test-results/browser-install.log; exit 1; }
      - name: Existing regression suite
        run: |
          python tests/browser_test.py
          python tests/running_browser_test.py
      - name: Additional final stress suite
        if: always()
        run: python tests/final_stress_test.py
      - name: Commit verified minimal fixes on QA branch only
        run: |
          git add app.js training-plan.js package.json version.js version.json tests/final-fuzz.test.js tests/final_stress_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve progress during concurrent writes and historical rollbacks (3.5.1)'
            git push origin HEAD:qa/final-release-20261108
          fi
      - name: Results summary
        if: always()
        run: |
          for file in test-results/*results.json test-results/final-audit/*results.json test-results/failure.txt; do [ ! -f "$file" ] || cat "$file"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-audit-evidence
          path: test-results/
          retention-days: 14
