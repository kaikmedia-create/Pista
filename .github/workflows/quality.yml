name: Pista quality checks
on:
  push:
    branches: [main, gh-pages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          mkdir -p test-results
          pip install -q -r requirements-test.txt
          python -m playwright install --with-deps chromium webkit > test-results/browser-install.log 2>&1 || { tail -100 test-results/browser-install.log; exit 1; }
      - name: Verify published release on GitHub Pages
        if: github.ref == 'refs/heads/gh-pages'
        env:
          PISTA_URL: https://kaikmedia-create.github.io/Pista/
          PISTA_COMMIT: ${{ github.sha }}
        run: |
          python tests/wait_for_pages.py
          echo "PISTA_URL=https://kaikmedia-create.github.io/Pista/" >> "$GITHUB_ENV"
      - name: Chromium and WebKit end-to-end tests
        run: |
          python tests/browser_test.py
          python tests/running_browser_test.py
          python tests/drills_browser_test.py
      - name: Test evidence summary
        if: always()
        run: |
          if [ -f test-results/browser-results.json ]; then cat test-results/browser-results.json; fi
          if [ -f test-results/running-v35-results.json ]; then cat test-results/running-v35-results.json; fi
          if [ -f test-results/drills-results.json ]; then cat test-results/drills-results.json; fi
          if [ -f test-results/failure.txt ]; then cat test-results/failure.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pista-test-evidence
          path: test-results/
          retention-days: 14
